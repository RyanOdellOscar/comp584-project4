<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>
    
    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css">
    
 
  </head>  
  <body>
    <div class="wrapper">
        <section class="calculator-screen">
          <div class="display">
            <span class="current-value">0</span>
          </div>
        </section>
    
        <section class="calculator-buttons">
          <button class="clear-button">C</button>
          <button class="back-button">&lt;--</button>
          <button class="operator-button">/</button>
          <button class="number-button">7</button>
          <button class="number-button">8</button>
          <button class="number-button">9</button>
          <button class="operator-button">X</button>
          <button class="number-button">4</button>
          <button class="number-button">5</button>
          <button class="number-button">6</button>
          <button class="operator-button">-</button>
          <button class="number-button">1</button>
          <button class="number-button">2</button>
          <button class="number-button">3</button>
          <button class="operator-button">+</button>
          <button class="zero-button">0</button>
          <button class="sign-button">+/-</button>
          <button class="equals-button">=</button>
        </section>
    </div>
    <!-- import the webpage's script -->
    <script src="script.js"></script>
  </body>
</html>
